<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elliot Lowe Photography</title>
  <meta name="description" content="Street, landscape and portrait photography in black and white, from wherever the road leads.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Elliot Lowe Photography">
  <meta property="og:description" content="Street, landscape and portrait photography in black and white.">
  <meta property="og:url" content="https://elowe.co/">
  <meta property="og:image" content="https://elowe.co/photos/2025_11_10-England49.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="#top">Elliot Lowe</a>
    <nav aria-label="Main">
      <a href="#photos">Photographs</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section id="photos" class="viewer" aria-label="Photographs">
      <div class="stage">
        <img id="main" alt="">
        <button id="prev" class="zone zone--prev" aria-label="Previous photograph" hidden></button>
        <button id="next" class="zone zone--next" aria-label="Next photograph" hidden></button>
      </div>
      <div class="caption">
        <span class="cap-left">
          <span id="title"></span>
          <button id="info-btn" class="info-btn" type="button" aria-label="Photo details" aria-expanded="false" aria-controls="info" hidden>i</button>
        </span>
        <span id="count"></span>
        <dl id="info" class="info" hidden></dl>
      </div>
      <div id="thumbs" class="thumbs" hidden></div>
      <p id="empty" class="empty" hidden>Photographs coming soon.</p>
    </section>

    <section id="about" class="panel">
      <p class="eyebrow">About</p>
      <p class="lede">Street scenes, landscapes and portraits, made around the world and mostly in black and white.</p>
    </section>

    <section id="contact" class="panel panel--last">
      <p class="eyebrow">Contact</p>
      <p class="lede">Questions, prints, or just hello.</p>
      <a class="mail" href="mailto:photos@elowe.co">photos@elowe.co</a>
    </section>
  </main>

  <footer class="foot">
    <a href="https://instagram.com/elliot_lowe" rel="noopener">Instagram</a>
    <span>&copy; 2026 elowe.co. All rights reserved.</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
